[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-intelligence-runtime"
version = "0.2.0"
description = "Adaptive Intelligence Runtime (AIR): dynamic cognitive allocation, sibling agents, experience learning, independent assurance."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "websockets>=13.0",
  # MCP 2.x removed/renamed client APIs the connector relies on; pin the
  # 1.x line until 2.x compatibility is explicitly verified.
  "mcp>=1.30,<2",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
air = "air.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/air"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
